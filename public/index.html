<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>快传 · 分享文件与文字</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="page">
  <header class="brand">
    <h1 id="app-name">快传</h1>
    <span class="badge">自建分享</span>
    <span class="spacer"></span>
    <a class="muted small" href="/manage">我的分享</a>
  </header>
  <p class="lead">选择文件或粘贴文字，生成一个链接和 4 位密码，别人打开链接就能拿走。</p>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-file" role="tab" aria-selected="true" data-kind="file">文件</button>
    <button class="tab" id="tab-text" role="tab" aria-selected="false" data-kind="text">文字</button>
  </div>

  <section class="card">
    <div class="modes">
      <label class="mode">
        <input type="radio" name="mode" value="p2p" checked>
        <b>P2P 直传</b>
        <span>文件不经过服务器磁盘，直接在你的浏览器和对方之间传。需要保持本页面打开。</span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="staged">
        <b>暂存到服务器</b>
        <span>上传到服务器保存，默认 24 小时。发完就可以关页面。</span>
      </label>
    </div>

    <div id="file-panel">
      <label class="field">
        <span>选择文件（可多选）</span>
        <input type="file" id="file-input" multiple>
      </label>
      <label class="field">
        <span>或选择整个文件夹（保留目录结构）</span>
        <input type="file" id="dir-input" webkitdirectory multiple>
      </label>
      <ul class="file-list" id="file-list"></ul>
      <p class="muted small" id="file-summary"></p>
    </div>

    <div id="text-panel" hidden>
      <label class="field">
        <span>要分享的文字</span>
        <textarea id="text-input" placeholder="在这里粘贴文字…"></textarea>
      </label>
      <p class="muted small" id="text-count"></p>
    </div>

    <hr class="divider">

    <div class="grid-2">
      <label class="field">
        <span>有效期</span>
        <select id="ttl-select"></select>
      </label>
      <label class="field">
        <span>最多被取走几次（留空表示不限）</span>
        <input type="number" id="max-downloads" min="1" max="100000" placeholder="不限">
      </label>
    </div>

    <label class="check"><input type="checkbox" id="password-toggle"> 使用密码保护（自动生成 4 位密码）</label>
    <label class="check"><input type="checkbox" id="burn-toggle"> 阅后即焚（被取走一次后立即销毁）</label>

    <div class="row">
      <button class="primary" id="create-btn">生成链接</button>
      <span class="muted small" id="create-status"></span>
    </div>
  </section>

  <section class="card" id="result" hidden>
    <h2>分享已创建</h2>

    <div class="field">
      <span>把这个链接发给对方</span>
      <div class="row">
        <code class="share-link" id="share-url"></code>
        <button class="tiny" id="copy-url">复制链接</button>
        <a class="tiny" id="open-url" href="#" target="_blank" rel="noreferrer">打开</a>
      </div>
    </div>

    <div id="password-wrap" hidden>
      <div class="password-box">
        <div>
          <div class="small muted">密码（只显示这一次）</div>
          <b id="share-password"></b>
        </div>
        <button class="tiny" id="copy-password">复制密码</button>
      </div>
      <p class="muted small">链接和密码要分开发送，别放在同一条消息里。</p>
    </div>

    <div class="qr-wrap">
      <div>
        <div class="small muted">手机扫码打开</div>
        <img class="qr" id="qr-img" alt="分享二维码">
      </div>
      <div class="stack" style="flex:1; min-width:220px">
        <label class="field" style="margin:0">
          <span>链接里使用哪个地址</span>
          <select id="origin-select"></select>
        </label>
        <p class="muted small">对方和你不在同一台机器时，请选一个他能访问到的地址。</p>
        <div id="sender-status" class="notice" hidden></div>
        <progress id="progress" value="0" max="100" hidden></progress>
        <p class="muted small" id="progress-text"></p>
      </div>
    </div>

    <ol class="steps" id="next-steps"></ol>
  </section>
</main>
<script type="module" src="/js/create.js"></script>
</body>
</html>
