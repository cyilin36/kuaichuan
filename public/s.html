<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f6f3">
<meta name="robots" content="noindex">
<title>接收分享 · 快传</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<div class="app">
  <aside class="sidebar" aria-label="主导航">
    <div class="sidebar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">快</span>
        <span class="brand-name" id="app-name">快传</span>
      </a>

      <nav class="nav" aria-label="页面导航">
        <p class="nav-label">工作区</p>
        <a class="nav-item" href="/">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5"/></svg>
          新建分享
        </a>
        <a class="nav-item" href="/manage">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11v8h-11z"/><path d="M2.5 4.5 8 9l5.5-4.5"/></svg>
          我的分享
        </a>
      </nav>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="content">
      <header class="page-head">
        <h1 class="page-title">接收分享</h1>
      </header>

      <p class="muted" id="status" role="status" aria-live="polite">正在读取分享信息…</p>

      <section class="card" id="unlock-card" hidden aria-labelledby="unlock-title">
        <h2 id="unlock-title">这个分享需要密码</h2>
        <p class="muted small" id="unlock-sub"></p>
        <form id="unlock-form" class="unlock-form">
          <div class="field">
            <label class="field-label" for="password-input">请输入 4 位密码（区分大小写）</label>
            <input class="password-input" type="text" id="password-input" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
          </div>
          <div class="action-row">
            <button class="primary" type="submit" id="unlock-btn">查看</button>
            <span class="small danger" id="unlock-error" role="alert"></span>
          </div>
        </form>
      </section>

      <section class="card" id="content-card" hidden aria-labelledby="content-title">
        <h2 id="content-title" tabindex="-1">分享内容</h2>
        <p class="muted small" id="content-meta"></p>
        <div id="notices" class="notices" role="status" aria-live="polite"></div>

        <div class="panel" id="file-panel" hidden>
          <ul class="file-list" id="file-list" aria-label="分享的文件" tabindex="0"></ul>
          <div class="action-row" id="file-actions"></div>
          <p class="field-hint" id="file-hint"></p>
        </div>

        <div class="panel" id="text-panel" hidden>
          <pre class="text-view" id="text-view" tabindex="0"></pre>
          <div class="action-row" id="text-actions"></div>
        </div>

        <div class="transfer" id="transfer" hidden>
          <progress id="progress" value="0" max="100" aria-label="传输进度"></progress>
          <p class="field-hint" id="transfer-text"></p>
        </div>
      </section>
    </div>
  </main>
</div>

<script type="module" src="/js/receive.js"></script>
</body>
</html>
