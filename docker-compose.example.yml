# 快传 —— Docker 部署示例
#
# 用法：
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d
#   打开 http://localhost:7654
#
# 想改端口 / 有效期 / 容量，直接改下面的 environment。
#
# 部署不需要 sudo：容器启动时会先修正数据目录的属主，再降权到非 root 用户运行，
# 所以无论用命名卷还是宿主机目录，都不需要在宿主机上执行 chown。

services:
  kuaichuan:
    build: .
    image: kuaichuan:latest
    container_name: kuaichuan
    restart: unless-stopped
    ports:
      - "7654:7654"
    environment:
      APP_NAME: 快传
      PORT: "7654"
      DATA_DIR: /data
      ALLOW_EXTERNAL_DATA_DIR: "1"

      # 「先上传到服务器」的保留时长与上限；直接传输不需要设置有效期
      DEFAULT_TTL_HOURS: "24"
      MAX_TTL_HOURS: "168"              # 也是直接传输分享记录的最长清理期
      MAX_FILE_BYTES: "2147483648"      # 上传到服务器的单文件 2GB
      MAX_P2P_FILE_BYTES: "0"           # 直接传输的单文件上限，0 表示不限制
      MAX_TEXT_BYTES: "1048576"         # 单条文字 1MB
      MAX_TOTAL_BYTES: "21474836480"    # 暂存总量 20GB，0 表示不限制

      # P2P 打洞失败时用服务器内存转发（全程不落盘）；设为 0 可关闭
      RELAY_ENABLED: "1"
      RELAY_WAIT_SECONDS: "120"
      RELAY_MAX_SESSIONS: "8"

      # STUN 服务器（可选，逗号分隔）。程序内置的默认值就是下面这两个公共服务器，
      # 所以不写这一项与写上去效果相同；显式留空字符串表示只尝试内网直连。
      # 打洞失败会自动改用服务器内存转发（全程不落盘），因此不需要 TURN。
      # STUN_URLS: "stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302"

      # 令牌签名密钥。留空则首次启动自动生成并保存到数据目录
      # TOKEN_SECRET: 换成一串随机字符

      LOG_LEVEL: info

    volumes:
      # 默认用命名卷：Docker 会沿用镜像里 /data 的属主，容器内的非 root 用户可直接写入。
      - kuaichuan-data:/data
      # 想在宿主机上直接看到数据文件，改用下面这行即可。
      # 容器启动时会自动把目录属主调整为容器内的运行用户（uid 1000），
      # 所以不需要在宿主机执行 chown 或 sudo。
      # - ./data:/data

volumes:
  kuaichuan-data:
